<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Period Tracker - 女性经期追踪管理应用</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Period Tracker</h1>
            <p class="subtitle">女性经期追踪管理应用</p>
        </header>

        <main>
            <section class="calendar-section">
                <div class="calendar-header">
                    <button id="prevMonth" class="btn-nav">&lt;</button>
                    <h2 id="currentMonth"></h2>
                    <button id="nextMonth" class="btn-nav">&gt;</button>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Calendar will be generated by JavaScript -->
                </div>
            </section>

            <section class="tracking-section">
                <h2>记录经期</h2>
                <div class="tracking-controls">
                    <button id="startPeriod" class="btn-primary">开始经期</button>
                    <button id="endPeriod" class="btn-secondary" disabled>结束经期</button>
                </div>
                <div class="current-status" id="currentStatus">
                    <p>当前状态: <span id="statusText">未记录</span></p>
                </div>
            </section>

            <section class="stats-section">
                <h2>周期统计</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>平均周期</h3>
                        <p id="avgCycle">--</p>
                        <span class="unit">天</span>
                    </div>
                    <div class="stat-card">
                        <h3>平均经期</h3>
                        <p id="avgPeriod">--</p>
                        <span class="unit">天</span>
                    </div>
                    <div class="stat-card">
                        <h3>下次预测</h3>
                        <p id="nextPrediction">--</p>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Period Tracker. All rights reserved.</p>
        </footer>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
